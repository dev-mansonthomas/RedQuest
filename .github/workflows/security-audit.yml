name: Security Audit

on:
  pull_request:
    branches: [master]
  schedule:
    # Every Monday at 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: npm audit + lockfile integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Actions are pinned by 40-char commit SHA (not by tag) to mitigate the
      # tj-actions class of attacks where a malicious tag move could swap the
      # action code. Renovate / Dependabot will keep these up to date and the
      # comment next to the SHA documents the resolved tag.
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Setup Node from .nvmrc
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: '.nvmrc'

      - name: Install (strict lockfile)
        env:
          NODE_OPTIONS: --openssl-legacy-provider
        run: npm ci

      - name: npm audit (informational, full output)
        run: npm audit --audit-level=info || true

      - name: npm audit signatures (registry-side integrity)
        run: npm audit signatures
        continue-on-error: true

      - name: Ratchet vs baseline (fail only if vulns grew)
        run: |
          npm audit --json > /tmp/audit-current.json || true
          node <<'JS'
          const fs = require('fs');
          const cur = JSON.parse(fs.readFileSync('/tmp/audit-current.json', 'utf8'));
          const base = JSON.parse(fs.readFileSync('docs/security-baseline-2026-05-15-post-wave1.json', 'utf8'));
          const cm = cur.metadata.vulnerabilities;
          const bm = base.metadata.vulnerabilities;
          const sevs = ['critical', 'high', 'moderate', 'low'];
          const grown = [];
          console.log('Severity | baseline | current');
          console.log('---------|----------|--------');
          for (const s of sevs) {
            const b = bm[s] || 0;
            const c = cm[s] || 0;
            console.log(`${s.padEnd(8)} | ${String(b).padStart(8)} | ${String(c).padStart(7)}`);
            if (c > b) grown.push(`${s}: ${b} -> ${c}`);
          }
          if (grown.length) {
            console.error('\nFAIL: new vulnerabilities introduced vs baseline:');
            grown.forEach(g => console.error('  - ' + g));
            process.exit(1);
          } else {
            console.log('\nOK: no vulnerability count growth vs baseline.');
          }
          JS
